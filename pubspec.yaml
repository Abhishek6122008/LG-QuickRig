name: lg_quickrig
description: "LG QuickRig — Home screen widget & Quick Settings companion for Liquid Galaxy."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  tray_manager: ^0.2.3

  # Raising/hiding the Linux window from the tray. There is no way to do
  # it from Dart otherwise, and without it every tray menu item that
  # opens a dialog looks like it does nothing.
  window_manager: ^0.4.3
  image_picker: ^1.1.2
  dartssh2: ^2.9.0

  # Copilot talks to the Gemini REST API directly — the official Dart SDK
  # is deprecated and its replacement drags in all of Firebase.
  http: ^1.2.2

  # Encrypted storage for SSH credentials (host, username, password).
  # Uses Android Keystore (API 23+) / iOS Keychain / libsecret on Linux.
  flutter_secure_storage: ^9.2.2

  # Service locator / dependency injection — no code generation required.
  get_it: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
