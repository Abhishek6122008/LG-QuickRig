name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  FLUTTER_VERSION: '3.38.7'

jobs:
  # Analyzer, unit/widget tests, the real integration test on the Linux
  # desktop target, then the .deb — one job because each stage needs the
  # previous one's `flutter pub get` and build output.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev xvfb

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # Needs a display and a real engine — the fakes keep it off the network
      # and out of the keyring, so no rig and no secrets are required.
      - name: Integration test (Linux desktop)
        run: xvfb-run -a flutter test integration_test -d linux

      - name: Build .deb
        run: bash packaging/build_deb.sh

      # The control file's Depends list is hand-written; this is the check
      # that it actually resolves on a clean machine.
      - name: Install the package
        run: |
          sudo apt-get install -y ./build/deb/*.deb
          test -x /opt/lg-quickrig/lg_quickrig
          test -f /usr/share/applications/lg-quickrig.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: lg-quickrig-deb
          path: build/deb/*.deb

  # Android is the primary platform, so every push should leave an installable
  # APK behind for the demo. Release-signed only if a keystore is configured;
  # otherwise it is debug-signed, which is fine for an artifact.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: lg-quickrig-apk
          path: build/app/outputs/flutter-apk/app-release.apk
